name: Publish container

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  repository_dispatch:
    types: [publish-release]

env:
  RELEASE_TAG: ${{ github.event.client_payload.release_tag || github.ref_name }}
  EXPECTED_RELEASE_SHA: ${{ github.event_name == 'push' && github.event.after || '' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Verify immutable release tag
        id: release
        run: |
          release_tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [[ "$RELEASE_TAG" =~ $release_tag_pattern ]]
          release_sha=$(git rev-parse "$RELEASE_TAG^{commit}")
          test "$release_sha" = "$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$release_sha" = "$EXPECTED_RELEASE_SHA"
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Verify pinned Orca source
        run: |
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          orca_source="$temp_dir/orca"
          scripts/fetch-orca-source.sh "$orca_source"
          ORCA_SOURCE_DIR="$orca_source" \
            cargo test --locked --test pinned_source -- --ignored
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          tags: orca-slicer-api:release-gate
      - run: |
          python3 tests/container/test_runtime.py orca-slicer-api:release-gate
        env:
          CONTAINER_ENGINE: docker

  publish:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          driver: docker-container
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.revision=${{ needs.gate.outputs.release_sha }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
