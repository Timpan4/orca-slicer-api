name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
  container-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Verify pinned Orca source
        run: |
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          orca_source="$temp_dir/orca"
          scripts/fetch-orca-source.sh "$orca_source"
          ORCA_SOURCE_DIR="$orca_source" \
            cargo test --locked --test pinned_source -- --ignored
      - run: tests/container/test_contract.sh
  real-container:
    needs: [rust, container-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          tags: orca-slicer-api:ci
      - run: python3 tests/container/test_runtime.py orca-slicer-api:ci
        env:
          CONTAINER_ENGINE: docker
